[project]
name = "rasiko"
version = "1.0.0"
description = "Rasiko: cold drinks and beverages delivery shop for Rajkot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "apps/*/management/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations", "frontend/node_modules", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "BLE"]
ignore = ["E501", "S101", "S311", "DJ001", "DJ008", "B904", "S308"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S107"]
"conftest.py" = ["S105", "S106"]
"config/settings/*" = ["F405", "S105"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "migrations"

[tool.bandit]
exclude_dirs = ["tests", "frontend", ".venv", "venv"]
skips = ["B101"]
