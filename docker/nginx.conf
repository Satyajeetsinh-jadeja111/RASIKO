# Nginx in front of the Rasiko app. TLS certificates come from Let's Encrypt (see README).
upstream rasiko_app { server web:8000; }

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 12m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        # Uploaded files are images only; never run them as scripts or HTML.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        types { image/webp webp; image/jpeg jpg jpeg; image/png png; image/gif gif; image/avif avif; }
        default_type application/octet-stream;
    }

    location /static/ {
        alias /app/staticfiles/;
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public";
        # Only content-hashed assets are immutable; originals must expire normally.
        location ~* "^/static/(.+\.[0-9a-f]{12}\.[^/]+)$" {
            alias /app/staticfiles/$1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /readyz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://rasiko_app;
        include /etc/nginx/proxy_common.conf;
    }

    location /payments/webhooks/ {
        proxy_pass http://rasiko_app;
        include /etc/nginx/proxy_common.conf;
    }

    location /ws/ {
        proxy_pass http://rasiko_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location /accounts/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://rasiko_app;
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://rasiko_app;
        include /etc/nginx/proxy_common.conf;
    }
}
