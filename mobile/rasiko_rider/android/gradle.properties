# Project-local limits for the 8 GB / 4-thread development laptop.
org.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2 -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
# Share the bounded Gradle JVM instead of starting another Kotlin compiler daemon.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
