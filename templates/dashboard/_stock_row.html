<tr id="v{{ v.pk }}">
  <td><a class="link" href="{% url 'dashboard:product_edit' v.product_id %}">{{ v.product.name }}</a> <span class="muted">{{ v.label }}</span>{% if error %}<div class="err">{{ error }}</div>{% elif saved %}<div class="save" style="font-size:12px">Saved</div>{% endif %}</td>
  <td class="muted">{{ v.sku }}</td>
  <td class="num"><span class="chip {% if not v.in_stock %}chip--red{% elif v.is_low_stock %}chip--orange{% else %}chip--green{% endif %}">{{ v.available_qty }}</span>{% if v.reserved_qty %}<br><span class="muted" style="font-size:12px">{{ v.reserved_qty }} held</span>{% endif %}</td>
  <td><form hx-post="{% url 'dashboard:stock_update' v.pk %}" hx-target="#v{{ v.pk }}" hx-swap="outerHTML" style="display:flex;gap:6px">{% csrf_token %}<input type="hidden" name="action" value="set_qty"><label class="sr-only" for="q{{ v.pk }}">Counted quantity for {{ v }}</label><input class="input qty-input" id="q{{ v.pk }}" type="number" min="0" name="qty" value="{{ v.stock_qty }}"><select class="input" name="reason" aria-label="Reason" style="width:auto"><option value="manual">Recount</option><option value="damage">Damaged</option></select><button class="btn btn--ghost btn--sm">Set</button></form></td>
  <td><form hx-post="{% url 'dashboard:stock_update' v.pk %}" hx-target="#v{{ v.pk }}" hx-swap="outerHTML" hx-trigger="change">{% csrf_token %}<input type="hidden" name="action" value="toggle_oos"><label class="switch"><input type="checkbox" {% if v.manual_out_of_stock %}checked{% endif %} aria-label="Mark {{ v }} out of stock"><span></span></label></form></td>
  <td><form hx-post="{% url 'dashboard:stock_update' v.pk %}" hx-target="#v{{ v.pk }}" hx-swap="outerHTML" hx-trigger="change">{% csrf_token %}<input type="hidden" name="action" value="toggle_active"><label class="switch"><input type="checkbox" {% if v.is_active %}checked{% endif %} aria-label="Sell {{ v }}"><span></span></label></form></td>
</tr>
