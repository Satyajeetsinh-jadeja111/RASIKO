<div class="field"{% if wide %} style="grid-column:1/-1"{% endif %}>{% if f.field.widget.input_type == "checkbox" %}<label style="display:flex;gap:8px;align-items:center">{{ f }} {{ f.label }}</label>{% else %}<label class="label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% endif %}{% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>
