{% extends "emails/_base.html" %}{% block body %}<h1 style="font:700 22px Arial,sans-serif;margin:0 0 8px;color:#1B6E42">Reset your password</h1><p>Hi {{ user.display_name }}, tap below to choose a new password.</p><p style="margin:18px 0"><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="background:#2FA05A;color:#FFFFFF;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;display:inline-block">Choose a new password</a></p><p style="color:#6D4C41;font-size:13px">If you didn't ask for this, ignore this email.</p>{% endblock %}
